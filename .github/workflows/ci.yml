# Runs on every push and pull request: 150+ unit tests (with coverage), the science checks
# against physics and published studies, and a production build.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        run: npx vitest run --coverage
      - name: Science checks
        run: node scripts/sanity-check.mjs
      - name: Production build
        run: npx vite build
